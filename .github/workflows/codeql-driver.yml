name: Analyze EchoVault driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'shared/**'
      - 'packages.config'
      - 'Directory.Build.props'
      - '.github/workflows/codeql-driver.yml'

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: driver-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Microsoft Windows-driver CodeQL
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run source safety checks
        shell: pwsh
        run: ./driver/test-driver-safety.ps1

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK and SDK packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Initialize CodeQL with Microsoft driver queries
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          # The driver suite imports microsoft/cpp-queries. Select one query
          # already present in that suite so the companion pack is installed
          # without running its unrelated example/default query collection.
          packs: microsoft/cpp-queries@0.0.5:Microsoft/Security/Cryptography/BannedEncryption.ql,microsoft/windows-drivers@1.10.0:windows-driver-suites/recommended.qls

      - name: Build x64 Release driver for CodeQL
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE/driver/bin/codeql/x64/Release"
          $intDir = "$env:GITHUB_WORKSPACE/driver/obj/codeql/x64/Release"
          msbuild driver\EchoVaultFilter.vcxproj `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:OutDir=$outDir/" `
            "/p:IntDir=$intDir/" `
            /m
          if ($LASTEXITCODE -ne 0) { throw "CodeQL build failed with exit code $LASTEXITCODE." }

      - name: Analyze with Microsoft Windows-driver rules
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/windows-driver
          output: codeql-results

      - name: Require zero EchoVault-source CodeQL findings
        if: always()
        shell: pwsh
        run: |
          $sarifFiles = @(Get-ChildItem -LiteralPath codeql-results -Filter '*.sarif' -File -Recurse -ErrorAction SilentlyContinue)
          if (-not $sarifFiles) {
            throw 'CodeQL did not produce a SARIF result file.'
          }

          $findings = [Collections.Generic.List[object]]::new()
          foreach ($sarifFile in $sarifFiles) {
            $sarif = Get-Content -LiteralPath $sarifFile.FullName -Raw | ConvertFrom-Json
            foreach ($run in @($sarif.runs)) {
              foreach ($result in @($run.results)) {
                $projectUri = @($result.locations | ForEach-Object {
                  $_.physicalLocation.artifactLocation.uri
                } | Where-Object {
                  if (-not $_) { return $false }
                  $normalized = [Uri]::UnescapeDataString(([string]$_).Replace('\', '/'))
                  return $normalized -match '(?i)(^|/)(driver|shared)/'
                } | Select-Object -First 1)
                if ($projectUri) {
                  $findings.Add([pscustomobject]@{
                    Rule = [string]$result.ruleId
                    Level = [string]$result.level
                    File = [Uri]::UnescapeDataString([string]$projectUri[0])
                    Message = [string]$result.message.text
                  })
                }
              }
            }
          }

          if ($findings.Count) {
            $findings | Sort-Object File, Rule | Format-Table -AutoSize -Wrap
            throw "Microsoft Windows-driver CodeQL found $($findings.Count) result(s) in EchoVault driver/shared source. Review and fix or explicitly justify every result before treating this workflow as green."
          }
          Write-Host 'Microsoft Windows-driver CodeQL reported zero findings in EchoVault driver/shared source.'

      - name: Upload readable CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EchoVault-driver-CodeQL-SARIF
          if-no-files-found: warn
          retention-days: 14
          path: codeql-results
