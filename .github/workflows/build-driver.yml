name: Build EchoVault driver

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'driver/**'
      - 'shared/**'
      - 'packages.config'
      - 'Directory.Build.props'
      - '.github/workflows/build-driver.yml'

permissions:
  contents: read

concurrency:
  group: driver-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-driver:
    name: Validate and build x64 driver
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run source safety checks
        shell: pwsh
        run: ./driver/test-driver-safety.ps1

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK and SDK packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Run user-mode driver logic tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools were not found on the runner.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $command = "`"$vcvars`" >nul && " +
            "cl /nologo /O2 /W4 driver\test-evtable.c /Fe:test-evtable.exe && test-evtable.exe && " +
            "cl /nologo /O2 /W4 /I driver\stubcheck driver\stubcheck\test-evdevpath.c /Fe:test-evdevpath.exe && test-evdevpath.exe"
          cmd /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "Driver logic tests failed with exit code $LASTEXITCODE." }

      - name: Build x64 Release driver
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE/driver/bin/x64/Release"
          $intDir = "$env:GITHUB_WORKSPACE/driver/obj/x64/Release"
          msbuild driver\EchoVaultFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:OutDir=$outDir/" `
            "/p:IntDir=$intDir/" `
            "/bl:$outDir/EchoVaultFilter.binlog" `
            /m
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE." }

      - name: Verify and describe artifact
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'driver\bin\x64\Release'
          $sys = Join-Path $out 'EchoVaultFilter.sys'
          if (-not (Test-Path -LiteralPath $sys)) { throw 'MSBuild succeeded but EchoVaultFilter.sys is missing.' }

          $tag = 'EVBUILD-SAFEUNLOAD-20260826'
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($sys))
          if (-not $ascii.Contains($tag)) { throw "The built driver does not contain expected tag $tag." }

          $hash = (Get-FileHash -LiteralPath $sys -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out 'EchoVaultFilter.sys.sha256') `
            -Value "$hash  EchoVaultFilter.sys" -Encoding ascii
          @(
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_RUN_ID"
            "build_tag=$tag"
            "sha256=$hash"
            'start_type=SERVICE_DEMAND_START'
            'host_driver_loaded=false'
          ) | Set-Content -LiteralPath (Join-Path $out 'build-info.txt') -Encoding ascii

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoVaultFilter-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            driver/bin/x64/Release/EchoVaultFilter.sys
            driver/bin/x64/Release/EchoVaultFilter.sys.sha256
            driver/bin/x64/Release/build-info.txt
            driver/bin/x64/Release/EchoVaultFilter.binlog
            driver/EchoVaultFilter.inf
